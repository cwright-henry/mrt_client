<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <title>Mean Reversion Trader</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Material+Icons">
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    .splash {
      font-family: Arial, Helvetica, sans-serif;
      height: 100vh;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #fff;
      background-color: #000;
    }

    .splash .logo {
      height: 58px;
      width: 58px;
      background: url(<%= BASE_URL %>svg/loading.svg) no-repeat;
      background-size: cover;
      background-position: center center;
      margin: 24px 0;
    }

    .splash .title {
      font-size: 32px;
    }

    .splash .subtitle {
      font-size: 24px;
      font-style: italic;
    }

    .splash .loading {
      font-size: 18px;
      color: #2196F3;
    }
  </style>
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-91611583-3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'UA-91611583-3');
  </script>
</head>

<body>
  <noscript>
    <strong>We're sorry but mrt doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
  </noscript>
  <div id="app">
    <div class="splash">
      <div class="title">Mean Reversion Trader</div>
      <div class="logo"></div>
      <div class="loading">Loading</div>
    </div>
  </div>
  <!-- built files will be auto injected -->
</body>

</html>
