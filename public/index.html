<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title>Bluecrowe Software</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Material+Icons">
    <style>
      body {
        margin:0;
        padding:0;
      }
      .splash {
        font-family: Arial, Helvetica, sans-serif;
        background-image: url(https://db33usvig9p6h.cloudfront.net/panels/cover/176771/large_2C402058-5823-4F23-99AA-623307E29B62.jpeg);
        height: 100vh;
        width:100%;
        background-size: cover;
        background-position: center center;
        box-sizing: border-box;
        display:flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: #fff;
      }
      .splash .logo {
        height: 16px;
        width: 16px;
        background: url(<%= BASE_URL %>img/icon-32x32.png) no-repeat;
        background-size: cover;
        background-position: center center;
        margin: 24px 0;
      }
      .splash .title {
        font-size: 120px;
      }
      .splash .subtitle {
        font-size: 24px;
        font-style: italic;
      }
      .splash .loading {
        font-size: 24px;
        color: #FFEB3B;
        margin: 24px 0 0;
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but mrt doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app">
      <div class="splash">
        <div class="title">Kappablue</div>
        <div class="subtitle">mathematical tools for traders</div>
        <div class="loading">Loading...</div>
      </div>
    </div>
    <!-- built files will be auto injected -->
  </body>
</html>
